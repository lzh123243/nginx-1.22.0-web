worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;
        client_max_body_size 10m;

        # 静态文件路径
        location / {
            root   /usr/share/nginx/html/sky;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # API 代理：将 /api/ 替换为 /admin/
         # 处理 HTTP API 请求
        location /api/ {
            proxy_pass https://sky-take-out666-production.up.railway.app/admin/;
            proxy_set_header Host sky-take-out666-production.up.railway.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 新增：处理 WebSocket 请求
        location /ws/ {
            proxy_pass https://sky-take-out666-production.up.railway.app/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host sky-take-out666-production.up.railway.app;
        }
        
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}